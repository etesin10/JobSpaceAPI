[project]
name = "jobfinder"
version = "0.1.0"
description = "AI-assisted job search: profiles, criteria, companies, roles and contacts with pluggable cloud/local LLMs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.9",
    "pycountry>=24.6",
    "typer>=0.12",
    "watchfiles>=0.22",
    "litellm>=1.50",
    "mcp>=1.2,<3",
    "truststore>=0.10.5",
]

[project.scripts]
jobfinder = "jobfinder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
